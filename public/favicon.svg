<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Main Rounded Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Top Left QR Finder Square -->
  <rect x="13" y="13" width="15" height="15" rx="3.5" stroke="#818cf8" stroke-width="3" />
  <rect x="17.5" y="17.5" width="6" height="6" rx="1.5" fill="#818cf8" />

  <!-- Top Right QR Finder Square -->
  <rect x="36" y="13" width="15" height="15" rx="3.5" stroke="#34d399" stroke-width="3" />
  <rect x="40.5" y="17.5" width="6" height="6" rx="1.5" fill="#34d399" />

  <!-- Bottom Left QR Finder Square -->
  <rect x="13" y="36" width="15" height="15" rx="3.5" stroke="#818cf8" stroke-width="3" />
  <rect x="17.5" y="40.5" width="6" height="6" rx="1.5" fill="#818cf8" />

  <!-- Bottom Right Study Desk / Checkmark Emblem -->
  <path d="M36 44.5L41.5 50L52 38" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
